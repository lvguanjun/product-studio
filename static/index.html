<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>速卖通白底主图 · 批量工作室</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-muted: #f9fafb;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --text: #111827;
      --text-2: #4b5563;
      --text-3: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eff6ff;
      --success: #059669;
      --success-soft: #ecfdf5;
      --warn: #d97706;
      --warn-soft: #fffbeb;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --radius: 12px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.25);
    }

    .brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .brand p {
      margin: 0;
      font-size: 12px;
      color: var(--text-3);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      color: var(--text-2);
    }

    .pill.ok {
      background: var(--success-soft);
      border-color: #a7f3d0;
      color: var(--success);
    }

    .pill.warn {
      background: var(--warn-soft);
      border-color: #fde68a;
      color: var(--warn);
    }

    .pill.err {
      background: var(--danger-soft);
      border-color: #fecaca;
      color: var(--danger);
    }

    .balance-pill {
      cursor: help;
    }

    .balance-banner {
      display: none;
      max-width: 1480px;
      margin: 14px auto 0;
      padding: 10px 24px 0;
    }

    .balance-banner.show {
      display: block;
    }

    .balance-banner-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 11px 14px;
      border-radius: var(--radius);
      background: var(--danger-soft);
      border: 1px solid #fecaca;
      color: #991b1b;
      font-size: 13px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    main {
      max-width: 1480px;
      margin: 0 auto;
      padding: 20px 24px 48px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }

    .sidebar {
      position: sticky;
      top: 76px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: calc(100vh - 96px);
      overflow-y: auto;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .section-title small {
      font-weight: 400;
      color: var(--text-3);
      font-size: 11px;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .preset-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--surface);
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    .preset-card:hover {
      border-color: var(--border-strong);
      background: var(--surface-muted);
    }

    .preset-card.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 1px var(--accent) inset;
    }

    .preset-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .preset-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .preset-tag {
      font-size: 11px;
      color: var(--accent);
      background: rgba(37, 99, 235, 0.08);
      padding: 1px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .preset-desc {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-3);
    }

    .preset-del {
      border: none;
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
    }

    .preset-del:hover { color: var(--danger); }

    textarea, select, input[type="text"] {
      width: 100%;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 9px 10px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    textarea:focus, select:focus, input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    textarea {
      min-height: 112px;
      resize: vertical;
      line-height: 1.5;
    }

    .prompt-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      justify-content: space-between;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .preprocess-box {
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: var(--text-2);
      cursor: pointer;
    }

    .check-row input {
      margin-top: 2px;
      accent-color: var(--accent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 9px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      text-decoration: none;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-muted);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-danger {
      background: var(--danger-soft);
      border-color: #fecaca;
      color: var(--danger);
    }

    .btn-danger:hover:not(:disabled) {
      background: #fee2e2;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 7px;
    }

    .btn-block {
      width: 100%;
      padding: 11px 16px;
      font-size: 14px;
    }

    .workspace {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .dropzone {
      border: 2px dashed var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .dropzone.compact {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      gap: 12px;
    }

    .dropzone.dragover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .dropzone-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .dropzone-sub {
      font-size: 12px;
      color: var(--text-3);
      margin-top: 4px;
    }

    .toolbar {
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--text-2);
    }

    .stats strong { color: var(--text); }

    .progress-wrap {
      width: 100%;
      height: 6px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #10b981);
      transition: width 0.25s ease;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }

    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
    }

    .item-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .item-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .badge-pending { background: #f3f4f6; color: #4b5563; }
    .badge-running { background: var(--accent-soft); color: var(--accent); }
    .badge-done { background: var(--success-soft); color: var(--success); }
    .badge-error { background: var(--danger-soft); color: var(--danger); }

    .compare-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
    }

    .img-pane {
      position: relative;
      aspect-ratio: 1 / 1;
      background: repeating-conic-gradient(#f3f4f6 0% 25%, #ffffff 0% 50%) 50% / 16px 16px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .img-pane.result-pane {
      background: #ffffff;
      cursor: zoom-in;
    }

    .img-pane img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .pane-label {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(17, 24, 39, 0.72);
      color: #fff;
    }

    .placeholder-state {
      padding: 16px;
      text-align: center;
      color: var(--text-3);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid #dbeafe;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .item-meta {
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text-3);
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--surface-muted);
      border-top: 1px solid var(--border);
      flex: 1;
    }

    .error-msg {
      color: var(--danger);
      font-size: 12px;
      word-break: break-word;
    }

    .item-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .empty-history {
      padding: 40px;
      text-align: center;
      color: var(--text-3);
      font-size: 13px;
    }

    .tabs {
      display: inline-flex;
      background: #eef0f4;
      border-radius: 9px;
      padding: 3px;
      gap: 3px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 5px 12px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: var(--surface);
      border-radius: 14px;
      max-width: 920px;
      width: 100%;
      max-height: 92vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-md);
    }

    .modal-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .slider-stage {
      position: relative;
      width: 100%;
      max-width: 640px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      user-select: none;
    }

    .slider-stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .slider-after-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #fff;
    }

    .slider-divider {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--accent);
      left: 50%;
      pointer-events: none;
    }

    .slider-handle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
      pointer-events: none;
    }

    .slider-range {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      display: block;
      accent-color: var(--accent);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #111827;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">白</div>
      <div>
        <h1>速卖通白底主图 · 批量工作室</h1>
        <p>智能预处理 + Cloudflare AI Gateway (GPT Image 2.5)</p>
      </div>
    </div>
    <div class="header-right">
      <div class="tabs">
        <button class="tab-btn active" id="tabBatch" onclick="switchTab('batch')">批量工作台</button>
        <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">历史生成</button>
      </div>
      <span class="pill balance-pill" id="balanceStatus" title="正在读取余额..."><span class="dot"></span>余额读取中...</span>
      <span class="pill" id="gatewayStatus"><span class="dot"></span>检测网关...</span>
    </div>
  </header>

  <div class="balance-banner" id="balanceBanner">
    <div class="balance-banner-inner" id="balanceBannerText"></div>
  </div>

  <main>
    <aside class="panel sidebar">
      <div>
        <div class="section-title">
          <span>1. 内置场景 Prompt</span>
          <small>点击套用，支持自定义保存</small>
        </div>
        <div class="preset-grid" id="presetGrid"></div>
      </div>

      <div>
        <div class="section-title">
          <span>2. 当前 Prompt（可直接修改）</span>
          <small id="promptCharCount">0 字</small>
        </div>
        <textarea id="promptInput" placeholder="输入或编辑生成指令..."></textarea>
        <div class="prompt-actions">
          <button class="btn btn-sm" type="button" onclick="resetPromptToPreset()">恢复当前模板</button>
          <button class="btn btn-sm" type="button" onclick="saveCustomPreset()">+ 存为我的模板</button>
        </div>
      </div>

      <div>
        <div class="section-title"><span>3. 模型与输出参数</span></div>
        <div class="form-grid">
          <div class="field" style="grid-column: span 2;">
            <label for="modelSelect">生图模型</label>
            <select id="modelSelect"></select>
          </div>
          <div class="field">
            <label for="qualitySelect">画质档位</label>
            <select id="qualitySelect">
              <option value="low">low（快速省钱）</option>
              <option value="medium" selected>medium（主力推荐）</option>
              <option value="high">high（最高细节）</option>
            </select>
          </div>
          <div class="field">
            <label for="concurrencySelect">批量并发数</label>
            <select id="concurrencySelect">
              <option value="1">1 路串行</option>
              <option value="2" selected>2 路并发（推荐）</option>
              <option value="3">3 路并发</option>
              <option value="4">4 路并发</option>
            </select>
          </div>
          <div class="field">
            <label for="exportSizeSelect">导出尺寸</label>
            <select id="exportSizeSelect">
              <option value="1000x1000" selected>1000×1000（速卖通标准）</option>
              <option value="800x800">800×800（轻量主图）</option>
              <option value="native">1024×1024（模型原生）</option>
            </select>
          </div>
          <div class="field">
            <label for="exportFormatSelect">导出格式</label>
            <select id="exportFormatSelect">
              <option value="png" selected>PNG（无损）</option>
              <option value="jpg">JPG（体积小）</option>
              <option value="webp">WEBP</option>
            </select>
          </div>
        </div>
      </div>

      <div>
        <div class="section-title"><span>4. 自动预处理（上传前优化）</span></div>
        <div class="preprocess-box">
          <label class="check-row">
            <input type="checkbox" id="optAutoCrop" checked />
            <span><strong>自动裁取手机长截图上半主图区</strong>（高宽比 &gt; 1.75 时去掉下方价格/评价区，省 Token 且商品文字更清晰）</span>
          </label>
          <label class="check-row">
            <input type="checkbox" id="optMaxEdge" checked />
            <span><strong>输入长边限 1024px</strong>（避免超高像素截图白烧输入 Token）</span>
          </label>
          <label class="check-row">
            <input type="checkbox" id="optEnhanceSmall" checked />
            <span><strong>小图轻度锐化增强</strong>（&lt; 650px 截图轻度锐化，提升小字识别率）</span>
          </label>
        </div>
      </div>

      <div>
        <button class="btn btn-primary btn-block" id="runBatchBtn" onclick="startOrStopBatch()">
          开始批量生成
        </button>
      </div>
    </aside>

    <section class="workspace" id="batchView">
      <div class="dropzone" id="dropzone">
        <div>
          <div class="dropzone-title">拖拽多张商品图 / 截图到这里，或点击选择图片</div>
          <div class="dropzone-sub">支持 JPG / PNG / WEBP 批量导入 · 也支持直接按 <strong>Ctrl + V</strong> 粘贴剪贴板截图</div>
        </div>
        <button class="btn btn-sm" type="button" id="pickBtn" style="display:none;">+ 继续添加图片</button>
        <input type="file" id="fileInput" accept="image/*" multiple hidden />
      </div>

      <div class="panel toolbar" id="toolbar" style="display:none;">
        <div style="flex:1; min-width: 240px;">
          <div class="stats" id="statsText"></div>
          <div class="progress-wrap" style="margin-top:8px;">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>
        <div class="toolbar-actions">
          <button class="btn btn-sm" id="retryFailedBtn" onclick="retryFailedItems()" style="display:none;">重试失败项</button>
          <button class="btn btn-sm btn-primary" id="zipBtn" onclick="downloadAllZip()" disabled>打包下载 ZIP</button>
          <button class="btn btn-sm btn-danger" onclick="clearQueue()">清空列表</button>
        </div>
      </div>

      <div class="card-grid" id="cardGrid"></div>
    </section>

    <section class="workspace" id="historyView" style="display:none;">
      <div class="panel toolbar">
        <div class="stats">
          <span>最近生成的成品图（保存在服务端 <code>outputs/</code>）</span>
        </div>
        <div class="toolbar-actions">
          <button class="btn btn-sm" onclick="loadHistory()">刷新</button>
          <button class="btn btn-sm btn-primary" onclick="downloadHistoryZip()">全部打包 ZIP</button>
        </div>
      </div>
      <div class="card-grid" id="historyGrid"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="compareModal" onclick="if (event.target === this) closeModal()">
    <div class="modal-box">
      <div class="modal-head">
        <strong id="modalTitle">原图 / 白底成品 细节对比</strong>
        <button class="btn btn-sm" onclick="closeModal()">关闭</button>
      </div>
      <div class="modal-body">
        <div class="slider-stage" id="sliderStage">
          <img id="modalOrigImg" alt="原图" />
          <div class="slider-after-wrap" id="sliderAfterWrap" style="clip-path: inset(0 0 0 50%);">
            <img id="modalResultImg" alt="生成图" />
          </div>
          <div class="slider-divider" id="sliderDivider"></div>
          <div class="slider-handle" id="sliderHandle">↔</div>
        </div>
        <input type="range" min="0" max="100" value="50" class="slider-range" id="compareSlider" oninput="updateSlider(this.value)" />
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <span id="modalMetaText" style="font-size:12px; color:var(--text-3);"></span>
          <a id="modalDownloadLink" class="btn btn-sm btn-primary" download>下载当前成品图</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const CUSTOM_PRESETS_KEY = "product_studio_custom_presets_v1";

    let builtInPresets = [];
    let customPresets = [];
    let activePresetId = "aliexpress_white";
    let queueItems = [];
    let historyItems = [];
    let isBatchRunning = false;
    let stopRequested = false;
    let balanceState = null;

    function formatUsd(amount, digits = 2) {
      const num = Number(amount);
      if (!Number.isFinite(num)) return "$0.00";
      return `$${num.toFixed(digits)}`;
    }

    function isGenerationDisabled() {
      return Boolean(balanceState && balanceState.disabled);
    }

    function guardGenerationAllowed() {
      if (!isGenerationDisabled()) return true;
      showToast((balanceState && balanceState.disabled_reason) || "余额低于阈值，已禁用生图");
      return false;
    }

    function formatResetTime(isoString, timezoneName) {
      if (!isoString) return "-";
      const parsed = new Date(isoString);
      if (Number.isNaN(parsed.getTime())) return isoString;
      const targetTz = timezoneName || "UTC";
      try {
        return `${parsed.toLocaleString(undefined, { timeZone: targetTz })} (${targetTz})`;
      } catch {
        return `${parsed.toISOString()} (${targetTz})`;
      }
    }

    function isStaleBalanceSnapshot(current, incoming) {
      if (!current || !incoming) return false;
      if (!current.configured || !incoming.configured) return false;
      if (
        current.key_fingerprint !== incoming.key_fingerprint ||
        current.billing_month !== incoming.billing_month
      ) {
        return false;
      }
      const curCount = Number(current.request_count || 0);
      const nextCount = Number(incoming.request_count || 0);
      if (nextCount < curCount) return true;
      if (nextCount === curCount && Number(incoming.used_usd || 0) < Number(current.used_usd || 0)) {
        return true;
      }
      return false;
    }

    function updateBalanceUI(nextBalance, options = {}) {
      if (!nextBalance || typeof nextBalance !== "object") return;
      if (!options.authoritative && isStaleBalanceSnapshot(balanceState, nextBalance)) {
        return;
      }
      balanceState = nextBalance;
      const pillEl = document.getElementById("balanceStatus");
      const bannerEl = document.getElementById("balanceBanner");
      const bannerTextEl = document.getElementById("balanceBannerText");

      if (!nextBalance.configured) {
        pillEl.className = "pill balance-pill err";
        pillEl.innerHTML = `<span class="dot"></span>未配置 API_KEY`;
        pillEl.title = nextBalance.disabled_reason || "未配置 API_KEY";
        bannerEl.classList.remove("show");
        renderQueue();
        return;
      }

      const remaining = formatUsd(nextBalance.remaining_usd, 2);
      const budget = formatUsd(nextBalance.monthly_budget_usd, 2);
      const used = formatUsd(nextBalance.used_usd, 3);
      const disableThreshold = formatUsd(nextBalance.disable_threshold_usd, 2);
      const warnThreshold = formatUsd(nextBalance.warn_threshold_usd, 2);
      const resetLabel = formatResetTime(nextBalance.next_reset_at, nextBalance.timezone);
      const offsetLine = nextBalance.offset_used_usd > 0
        ? `\n含外部校准偏移：${formatUsd(nextBalance.offset_used_usd, 2)}`
        : "";

      pillEl.title =
        `账期：${nextBalance.billing_month} (${nextBalance.timezone || "UTC"})\n` +
        `本月已用：${used} / ${budget}（共 ${nextBalance.request_count || 0} 次）${offsetLine}\n` +
        `预警阈值：${warnThreshold} · 禁用阈值：${disableThreshold}\n` +
        `下次重置：${resetLabel}\n` +
        `说明：基于官方单价的本地实时估算`;

      if (nextBalance.disabled || nextBalance.status === "disabled") {
        pillEl.className = "pill balance-pill err";
        pillEl.innerHTML = `<span class="dot"></span>余额不足 ${remaining}（已禁用）`;
        bannerTextEl.innerHTML =
          `<strong>生图功能已暂停：</strong>${escapeHtml(nextBalance.disabled_reason || `当前估算余额 ${remaining} 已触及禁用阈值 ${disableThreshold}。`)}` +
          `<span>历史记录浏览与图片 / ZIP 下载仍可正常使用。</span>`;
        bannerEl.classList.add("show");
      } else if (nextBalance.status === "warn") {
        pillEl.className = "pill balance-pill warn";
        pillEl.innerHTML = `<span class="dot"></span>余额 ${remaining} / ${budget}`;
        bannerEl.classList.remove("show");
      } else {
        pillEl.className = "pill balance-pill ok";
        pillEl.innerHTML = `<span class="dot"></span>余额 ${remaining} / ${budget}`;
        bannerEl.classList.remove("show");
      }
      renderQueue();
    }

    async function refreshBalance() {
      try {
        const response = await fetch("/api/balance");
        if (!response.ok) return;
        const data = await response.json();
        updateBalanceUI(data, { authoritative: true });
      } catch {
        // Keep existing UI state if refresh fails transiently
      }
    }

    function showToast(message) {
      const toastEl = document.getElementById("toast");
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toastEl.classList.remove("show"), 2600);
    }

    function loadCustomPresets() {
      try {
        const saved = localStorage.getItem(CUSTOM_PRESETS_KEY);
        customPresets = saved ? JSON.parse(saved) : [];
      } catch {
        customPresets = [];
      }
    }

    function saveCustomPresetsToStorage() {
      localStorage.setItem(CUSTOM_PRESETS_KEY, JSON.stringify(customPresets));
    }

    function getAllPresets() {
      return [...builtInPresets, ...customPresets];
    }

    function renderPresets() {
      const container = document.getElementById("presetGrid");
      container.innerHTML = "";
      for (const preset of getAllPresets()) {
        const card = document.createElement("div");
        card.className = "preset-card" + (preset.id === activePresetId ? " active" : "");
        card.onclick = () => selectPreset(preset.id);

        const head = document.createElement("div");
        head.className = "preset-head";

        const title = document.createElement("span");
        title.className = "preset-name";
        title.textContent = preset.name;
        head.appendChild(title);

        const rightWrap = document.createElement("div");
        rightWrap.style.display = "flex";
        rightWrap.style.alignItems = "center";
        rightWrap.style.gap = "4px";

        const tag = document.createElement("span");
        tag.className = "preset-tag";
        tag.textContent = preset.tag || "自定义";
        rightWrap.appendChild(tag);

        if (preset.custom) {
          const delBtn = document.createElement("button");
          delBtn.className = "preset-del";
          delBtn.title = "删除模板";
          delBtn.textContent = "×";
          delBtn.onclick = (event) => {
            event.stopPropagation();
            customPresets = customPresets.filter((item) => item.id !== preset.id);
            saveCustomPresetsToStorage();
            if (activePresetId === preset.id && builtInPresets.length) {
              selectPreset(builtInPresets[0].id);
            } else {
              renderPresets();
            }
            showToast("已删除自定义模板");
          };
          rightWrap.appendChild(delBtn);
        }

        head.appendChild(rightWrap);
        card.appendChild(head);

        if (preset.description) {
          const desc = document.createElement("div");
          desc.className = "preset-desc";
          desc.textContent = preset.description;
          card.appendChild(desc);
        }

        container.appendChild(card);
      }
    }

    function selectPreset(presetId) {
      const found = getAllPresets().find((item) => item.id === presetId);
      if (!found) return;
      activePresetId = found.id;
      const promptEl = document.getElementById("promptInput");
      promptEl.value = found.prompt;
      updatePromptCount();
      renderPresets();
    }

    function resetPromptToPreset() {
      selectPreset(activePresetId);
      showToast("已恢复模板默认 Prompt");
    }

    function saveCustomPreset() {
      const text = document.getElementById("promptInput").value.trim();
      if (!text) {
        showToast("Prompt 不能为空");
        return;
      }
      const name = window.prompt("给这个自定义 Prompt 模板起个名字：", "我的电商白底模板");
      if (!name || !name.trim()) return;
      const newPreset = {
        id: "custom_" + Date.now(),
        name: name.trim(),
        tag: "自定义",
        description: text.slice(0, 56) + (text.length > 56 ? "..." : ""),
        prompt: text,
        custom: true,
      };
      customPresets.push(newPreset);
      saveCustomPresetsToStorage();
      activePresetId = newPreset.id;
      renderPresets();
      showToast("已保存自定义模板");
    }

    function updatePromptCount() {
      const text = document.getElementById("promptInput").value;
      document.getElementById("promptCharCount").textContent = `${text.length} 字符`;
    }

    async function initApp() {
      loadCustomPresets();
      try {
        const response = await fetch("/api/config");
        const config = await response.json();
        builtInPresets = config.presets || [];
        const modelSelect = document.getElementById("modelSelect");
        modelSelect.innerHTML = "";
        for (const modelInfo of config.models || []) {
          const option = document.createElement("option");
          option.value = modelInfo.id;
          option.textContent = modelInfo.label;
          if (modelInfo.id === config.default_model) option.selected = true;
          modelSelect.appendChild(option);
        }
        const statusEl = document.getElementById("gatewayStatus");
        if (config.api_configured) {
          statusEl.className = "pill ok";
          statusEl.innerHTML = `<span class="dot"></span>CF 网关已就绪`;
        } else {
          statusEl.className = "pill err";
          statusEl.innerHTML = `<span class="dot"></span>未检测到 API_KEY`;
        }
        if (config.balance) {
          updateBalanceUI(config.balance, { authoritative: true });
        }
        if (builtInPresets.length > 0) {
          selectPreset(builtInPresets[0].id);
        }
      } catch (err) {
        const statusEl = document.getElementById("gatewayStatus");
        statusEl.className = "pill err";
        statusEl.innerHTML = `<span class="dot"></span>后端连接失败`;
        const balanceEl = document.getElementById("balanceStatus");
        balanceEl.className = "pill balance-pill err";
        balanceEl.innerHTML = `<span class="dot"></span>余额读取失败`;
      }
    }

    function addFiles(fileList) {
      const validFiles = Array.from(fileList).filter((file) => file.type.startsWith("image/"));
      if (!validFiles.length) {
        showToast("请选择有效的图片文件");
        return;
      }
      for (const file of validFiles) {
        const previewUrl = URL.createObjectURL(file);
        queueItems.push({
          uid: "item_" + Math.random().toString(36).slice(2, 10),
          file,
          name: file.name || `粘贴图片_${queueItems.length + 1}.png`,
          previewUrl,
          status: "pending",
          result: null,
          error: "",
        });
      }
      renderQueue();
      showToast(`已加入 ${validFiles.length} 张图片`);
    }

    function renderQueue() {
      const dropzone = document.getElementById("dropzone");
      const pickBtn = document.getElementById("pickBtn");
      const toolbar = document.getElementById("toolbar");
      const grid = document.getElementById("cardGrid");
      const runBtn = document.getElementById("runBatchBtn");

      if (queueItems.length > 0) {
        dropzone.classList.add("compact");
        pickBtn.style.display = "inline-flex";
        toolbar.style.display = "flex";
      } else {
        dropzone.classList.remove("compact");
        pickBtn.style.display = "none";
        toolbar.style.display = "none";
      }

      const total = queueItems.length;
      const doneCount = queueItems.filter((item) => item.status === "done").length;
      const runningCount = queueItems.filter((item) => item.status === "running").length;
      const errorCount = queueItems.filter((item) => item.status === "error").length;
      const pendingCount = queueItems.filter((item) => item.status === "pending").length;
      const totalTokens = queueItems.reduce((sum, item) => sum + ((item.result && item.result.usage && item.result.usage.total_tokens) || 0), 0);

      document.getElementById("statsText").innerHTML =
        `<span>共 <strong>${total}</strong> 张</span>` +
        `<span>已完成 <strong style="color:var(--success)">${doneCount}</strong></span>` +
        (runningCount ? `<span>处理中 <strong style="color:var(--accent)">${runningCount}</strong></span>` : "") +
        (errorCount ? `<span>失败 <strong style="color:var(--danger)">${errorCount}</strong></span>` : "") +
        (totalTokens ? `<span>累计 Tokens <strong>${totalTokens.toLocaleString()}</strong></span>` : "");

      const percent = total ? Math.round(((doneCount + errorCount) / total) * 100) : 0;
      document.getElementById("progressBar").style.width = `${percent}%`;

      const generationDisabled = isGenerationDisabled();
      document.getElementById("zipBtn").disabled = doneCount === 0;
      const retryFailedBtn = document.getElementById("retryFailedBtn");
      retryFailedBtn.style.display = errorCount > 0 && !isBatchRunning ? "inline-flex" : "none";
      retryFailedBtn.disabled = generationDisabled;

      if (isBatchRunning) {
        runBtn.textContent = stopRequested ? "正在停止..." : `停止剩余任务 (${doneCount}/${total})`;
        runBtn.className = "btn btn-danger btn-block";
        runBtn.disabled = false;
      } else if (generationDisabled) {
        runBtn.className = "btn btn-primary btn-block";
        runBtn.disabled = true;
        runBtn.textContent = balanceState && !balanceState.configured
          ? "未检测到 API_KEY"
          : "余额不足，已禁用生图";
      } else {
        const runnable = pendingCount + errorCount;
        runBtn.className = "btn btn-primary btn-block";
        runBtn.disabled = total === 0;
        runBtn.textContent = runnable > 0 ? `开始批量生成 (${runnable} 张待处理)` : total > 0 ? `重新生成全部 (${total} 张)` : "请先上传图片";
      }

      grid.innerHTML = "";
      for (const item of queueItems) {
        const card = document.createElement("div");
        card.className = "item-card";

        const statusLabelMap = {
          pending: ["待生成", "badge-pending"],
          running: ["生成中...", "badge-running"],
          done: ["已完成", "badge-done"],
          error: ["失败", "badge-error"],
        };
        const [badgeText, badgeClass] = statusLabelMap[item.status];

        let resultHtml = "";
        if (item.status === "done" && item.result) {
          resultHtml = `<img src="${item.result.url}?t=${item.result.created_at}" alt="白底成品" />
                        <span class="pane-label">白底成品</span>`;
        } else if (item.status === "running") {
          resultHtml = `<div class="placeholder-state"><div class="spinner"></div><span>预处理并生成中...</span></div>`;
        } else if (item.status === "error") {
          resultHtml = `<div class="placeholder-state"><span style="color:var(--danger);font-weight:600;">生成失败</span><span>可点击下方重试</span></div>`;
        } else {
          resultHtml = `<div class="placeholder-state"><span>等待开始</span></div>`;
        }

        let metaHtml = "";
        if (item.result) {
          const pre = item.result.preprocess || {};
          const actionsText = (pre.actions || []).join(" · ");
          const usage = item.result.usage || {};
          const costPart = item.result.cost_usd !== undefined
            ? ` · 约 ${formatUsd(item.result.cost_usd, 3)}`
            : "";
          metaHtml =
            `<div>预处理：${pre.orig_size || "-"} → ${pre.processed_size || "-"}（${actionsText}）</div>` +
            `<div>输出：${item.result.output_size} · ${item.result.size_kb} KB · 耗时 ${item.result.elapsed}s` +
            (usage.total_tokens ? ` · ${usage.total_tokens} tokens` : "") + `${costPart}</div>`;
        } else if (item.error) {
          metaHtml = `<div class="error-msg">${escapeHtml(item.error)}</div>`;
        } else {
          metaHtml = `<div>文件大小：${(item.file.size / 1024).toFixed(1)} KB</div>`;
        }

        card.innerHTML = `
          <div class="item-header">
            <span class="item-title" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</span>
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>
          <div class="compare-pair">
            <div class="img-pane">
              <img src="${item.previewUrl}" alt="原图" />
              <span class="pane-label">原图</span>
            </div>
            <div class="img-pane result-pane" ${item.result ? `onclick="openCompareModal('${item.uid}')"` : ""}>
              ${resultHtml}
            </div>
          </div>
          <div class="item-meta">${metaHtml}</div>
          <div class="item-footer">
            <div style="display:flex; gap:6px;">
              ${item.result ? `<button class="btn btn-sm" onclick="openCompareModal('${item.uid}')">滑块对比</button>` : ""}
              <button class="btn btn-sm" onclick="runSingleItem('${item.uid}')" ${(item.status === "running" || generationDisabled) ? "disabled" : ""}>${item.result ? "重生成" : "单张生成"}</button>
            </div>
            <div style="display:flex; gap:6px;">
              ${item.result ? `<a class="btn btn-sm btn-primary" href="${item.result.url}" download="${escapeHtml(item.result.filename)}">下载</a>` : ""}
              <button class="btn btn-sm" onclick="removeItem('${item.uid}')" ${item.status === "running" ? "disabled" : ""}>移除</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function removeItem(uid) {
      const found = queueItems.find((item) => item.uid === uid);
      if (found && found.previewUrl) URL.revokeObjectURL(found.previewUrl);
      queueItems = queueItems.filter((item) => item.uid !== uid);
      renderQueue();
    }

    function clearQueue() {
      if (isBatchRunning) {
        showToast("请先停止正在运行的任务");
        return;
      }
      for (const item of queueItems) {
        if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      }
      queueItems = [];
      renderQueue();
    }

    function buildFormData(file) {
      const formData = new FormData();
      formData.append("file", file, file.name || "image.png");
      formData.append("prompt", document.getElementById("promptInput").value.trim());
      formData.append("model", document.getElementById("modelSelect").value);
      formData.append("quality", document.getElementById("qualitySelect").value);
      formData.append("size", "1024x1024");
      formData.append("export_size", document.getElementById("exportSizeSelect").value);
      formData.append("export_format", document.getElementById("exportFormatSelect").value);
      formData.append("auto_crop_screenshot", document.getElementById("optAutoCrop").checked ? "true" : "false");
      formData.append("max_input_edge", document.getElementById("optMaxEdge").checked ? "1024" : "0");
      formData.append("enhance_small", document.getElementById("optEnhanceSmall").checked ? "true" : "false");
      return formData;
    }

    async function processOneItem(item) {
      item.status = "running";
      item.error = "";
      renderQueue();
      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          body: buildFormData(item.file),
        });
        let data = {};
        try {
          data = await response.json();
        } catch {
          data = {};
        }
        if (data && data.balance) {
          updateBalanceUI(data.balance);
          if (data.balance.disabled && isBatchRunning) {
            stopRequested = true;
          }
        }
        if (!response.ok) {
          if (response.status === 402 && isBatchRunning) {
            stopRequested = true;
          }
          throw new Error(data.detail || `请求失败 (${response.status})`);
        }
        item.status = "done";
        item.result = data;
      } catch (err) {
        item.status = "error";
        item.error = err.message || "未知错误";
      }
      renderQueue();
    }

    async function runSingleItem(uid) {
      if (!guardGenerationAllowed()) return;
      const promptText = document.getElementById("promptInput").value.trim();
      if (!promptText) {
        showToast("Prompt 不能为空");
        return;
      }
      const item = queueItems.find((entry) => entry.uid === uid);
      if (!item || item.status === "running") return;
      await processOneItem(item);
    }

    async function startOrStopBatch() {
      if (isBatchRunning) {
        stopRequested = true;
        renderQueue();
        showToast("将在当前请求完成后停止队列");
        return;
      }
      if (!guardGenerationAllowed()) return;
      const promptText = document.getElementById("promptInput").value.trim();
      if (!promptText) {
        showToast("请先输入 Prompt");
        return;
      }
      let targets = queueItems.filter((item) => item.status === "pending" || item.status === "error");
      if (targets.length === 0 && queueItems.length > 0) {
        for (const item of queueItems) {
          item.status = "pending";
          item.error = "";
        }
        targets = [...queueItems];
      }
      if (targets.length === 0) return;

      isBatchRunning = true;
      stopRequested = false;
      renderQueue();

      const concurrency = parseInt(document.getElementById("concurrencySelect").value, 10) || 2;
      let cursor = 0;

      async function worker() {
        while (!stopRequested && !isGenerationDisabled()) {
          const currentIndex = cursor++;
          if (currentIndex >= targets.length) break;
          await processOneItem(targets[currentIndex]);
        }
      }

      const workers = Array.from({ length: Math.min(concurrency, targets.length) }, () => worker());
      await Promise.all(workers);

      await refreshBalance();
      const stoppedForBalance = isGenerationDisabled();
      isBatchRunning = false;
      stopRequested = false;
      renderQueue();
      showToast(stoppedForBalance ? "余额已触及禁用阈值，已停止剩余任务" : "批量处理结束");
    }

    function retryFailedItems() {
      if (isBatchRunning || isGenerationDisabled()) return;
      for (const item of queueItems) {
        if (item.status === "error") item.status = "pending";
      }
      startOrStopBatch();
    }

    async function downloadZipByNames(filenames) {
      if (!filenames.length) return;
      try {
        const response = await fetch("/api/download-zip", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filenames }),
        });
        if (!response.ok) throw new Error("打包失败");
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `aliexpress_white_bg_${Date.now()}.zip`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      } catch (err) {
        showToast(err.message || "下载 ZIP 失败");
      }
    }

    function downloadAllZip() {
      const filenames = queueItems.filter((item) => item.status === "done" && item.result).map((item) => item.result.filename);
      downloadZipByNames(filenames);
    }

    function openCompareModal(uid) {
      const item = queueItems.find((entry) => entry.uid === uid);
      if (!item || !item.result) return;
      document.getElementById("modalTitle").textContent = `${item.name} — 拖动滑块对比细节`;
      document.getElementById("modalOrigImg").src = item.previewUrl;
      document.getElementById("modalResultImg").src = `${item.result.url}?t=${item.result.created_at}`;
      document.getElementById("modalMetaText").textContent =
        `${item.result.model} (${item.result.quality}) · ${item.result.output_size} · ${item.result.size_kb} KB · 耗时 ${item.result.elapsed}s`;
      const dl = document.getElementById("modalDownloadLink");
      dl.href = item.result.url;
      dl.download = item.result.filename;
      document.getElementById("compareSlider").value = 50;
      updateSlider(50);
      document.getElementById("compareModal").classList.add("open");
    }

    function updateSlider(val) {
      const pct = Number(val);
      document.getElementById("sliderAfterWrap").style.clipPath = `inset(0 0 0 ${pct}%)`;
      document.getElementById("sliderDivider").style.left = `${pct}%`;
      document.getElementById("sliderHandle").style.left = `${pct}%`;
    }

    function closeModal() {
      document.getElementById("compareModal").classList.remove("open");
    }

    function switchTab(tab) {
      document.getElementById("tabBatch").classList.toggle("active", tab === "batch");
      document.getElementById("tabHistory").classList.toggle("active", tab === "history");
      document.getElementById("batchView").style.display = tab === "batch" ? "flex" : "none";
      document.getElementById("historyView").style.display = tab === "history" ? "flex" : "none";
      if (tab === "history") loadHistory();
    }

    async function loadHistory() {
      const grid = document.getElementById("historyGrid");
      grid.innerHTML = `<div class="empty-history">加载中...</div>`;
      try {
        const response = await fetch("/api/history?limit=40");
        const data = await response.json();
        historyItems = data.items || [];
        if (!historyItems.length) {
          grid.innerHTML = `<div class="panel empty-history">暂无历史生成记录</div>`;
          return;
        }
        grid.innerHTML = "";
        for (const item of historyItems) {
          const card = document.createElement("div");
          card.className = "item-card";
          const costLabel = item.cost_usd !== undefined ? ` · 约 ${formatUsd(item.cost_usd, 3)}` : "";
          card.innerHTML = `
            <div class="item-header">
              <span class="item-title" title="${escapeHtml(item.orig_name)}">${escapeHtml(item.orig_name)}</span>
              <span class="badge badge-done">${item.output_size}</span>
            </div>
            <div class="img-pane result-pane" style="aspect-ratio:1/1;">
              <img src="${item.url}" alt="成品" />
            </div>
            <div class="item-meta">
              <div>${item.model} (${item.quality}) · ${item.size_kb} KB · ${item.elapsed}s${costLabel}</div>
              <div>${(item.preprocess && item.preprocess.actions || []).join(" · ")}</div>
            </div>
            <div class="item-footer">
              <span style="font-size:11px;color:var(--text-3);">${new Date(item.created_at * 1000).toLocaleString()}</span>
              <a class="btn btn-sm btn-primary" href="${item.url}" download="${escapeHtml(item.filename)}">下载</a>
            </div>
          `;
          grid.appendChild(card);
        }
      } catch (err) {
        grid.innerHTML = `<div class="panel empty-history">加载历史失败</div>`;
      }
    }

    function downloadHistoryZip() {
      downloadZipByNames(historyItems.map((item) => item.filename));
    }

    const dropzoneEl = document.getElementById("dropzone");
    const fileInputEl = document.getElementById("fileInput");

    dropzoneEl.addEventListener("click", () => fileInputEl.click());
    fileInputEl.addEventListener("change", (event) => {
      if (event.target.files.length) addFiles(event.target.files);
      event.target.value = "";
    });

    dropzoneEl.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropzoneEl.classList.add("dragover");
    });
    dropzoneEl.addEventListener("dragleave", () => dropzoneEl.classList.remove("dragover"));
    dropzoneEl.addEventListener("drop", (event) => {
      event.preventDefault();
      dropzoneEl.classList.remove("dragover");
      if (event.dataTransfer.files.length) addFiles(event.dataTransfer.files);
    });

    window.addEventListener("paste", (event) => {
      const items = event.clipboardData && event.clipboardData.items;
      if (!items) return;
      const files = [];
      for (const entry of items) {
        if (entry.type.startsWith("image/")) {
          const blob = entry.getAsFile();
          if (blob) files.push(blob);
        }
      }
      if (files.length) addFiles(files);
    });

    document.getElementById("promptInput").addEventListener("input", updatePromptCount);
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeModal();
    });

    initApp();
  </script>
</body>
</html>
